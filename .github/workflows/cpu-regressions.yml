name: CPU regressions
on:
  pull_request:
    branches: [neo-test]
  push:
    branches: [neo-test]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install packaging filelock tqdm Pillow==10.4.0 numpy "huggingface-hub>=0.34,<1.0" gradio==4.40.0 fastapi==0.127.1 httpx==0.28.1 pydantic==2.10.6
      - name: Require real Gradio HTTP test runtime
        run: python -c "import gradio, fastapi; assert gradio.__version__ == '4.40.0'; assert fastapi.__version__ == '0.127.1'"
      - name: Compile core Python files
        run: python -m compileall -q backend modules modules_forge scripts tests extensions/stable-diffusion-webui-tagger-fork tools/launch_xpu_profile.py extensions-builtin/sd_forge_spectrum extensions-builtin/sd_forge_controlnet extensions-builtin/sd_forge_ipadapter
      - name: Run regression suite with real CPU PyTorch
        run: python -m unittest discover -s tests -v
      - name: WD14 browser event regressions
        run: node --test tests/test_tagger_frontend.js
      - name: Check optimized Python mask protection
        run: python -O -m unittest discover -s tests -p test_vae_flash_regressions.py -v
      - name: Check optimized Python ControlNet lifecycle
        run: python -O -m unittest discover -s tests -p test_controlnet_lifecycle.py -v
      - name: Check isolated XPU profile contracts
        run: python -O -m unittest discover -s tests -p test_xpu_profiles.py -v
      - name: Check optimized Python WD14 model adapters
        run: python -O -m unittest discover -s tests -p test_wd14_models.py -v
      - name: Check optimized Python XPU attention modes
        run: python -O -m unittest discover -s tests -p test_xpu_attention.py -v

  windows-file-io:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install UI file handling test dependencies
        run: python -m pip install Pillow==10.4.0 "huggingface-hub>=0.34,<1.0" gradio==4.40.0 fastapi==0.127.1 httpx==0.28.1 pydantic==2.10.6
      - name: Native Windows upload sharing protection
        run: python -m unittest discover -s tests -p test_upload_cache.py -v
      - name: Settings acknowledgement and backup
        run: python -m unittest discover -s tests -p test_settings_version.py -v
      - name: Official XPU isolation without GPU inference
        run: python -m unittest discover -s tests -p test_xpu_profiles.py -v
